<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse AI</title>
<style>

  :root {
    --cyan: #38d6f0;
    --green: #a6f24a;
    --green-dim: rgba(166, 242, 74, 0.55);
    --cyan-dim: rgba(56, 214, 240, 0.55);
    --grad: linear-gradient(110deg, #0243be 0%, #1732be 30%, #6e20c4 70%, #ba28ca 100%);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: var(--font);
    background: var(--grad);
    color: #fff;
    overflow: hidden;
  }

  #app { height: 100vh; width: 100vw; position: relative; }
  #app { height: 100dvh; }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    box-sizing: border-box;
  }
  .screen.active { display: flex; }

  /* ───────── Кнопки ───────── */
  .btn2 {
    cursor: pointer;
    user-select: none;
    border: 2px solid var(--green);
    background: #000000;
    color: #fff;
    font-weight: 700;
    font-family: var(--font);
    border-radius: 10px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .btn2:hover {
    box-shadow: 0 0 8px rgba(166, 242, 74, 0.4);
  }
  .btn2.armed {
    border-color: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.7);
  }
  .btn2[disabled] {
    pointer-events: none;
    opacity: 0.4;
  }

  /* ───────── ENTRY SCREEN ───────── */
  #screen-entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-y: auto;
  }

  .entry-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px; /* Компактный и естественный отступ между всеми элементами */
    width: 100%;
    max-width: 760px;
    margin: auto 0;
  }

  /* 1. Верхняя карточка */
  .entry-title-bar {
    background: #000000;
    border: 2px solid var(--green);
    border-radius: 12px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: min(92vw, 760px);
    white-space: nowrap;
    box-shadow: 0 0 12px rgba(166, 242, 74, 0.2);
  }
  .entry-title-bar .intro {
    color: #ffffff;
    font-size: clamp(10px, 2.8vw, 14px);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .entry-title-bar .brand {
    font-size: clamp(14px, 4.2vw, 22px);
    font-weight: 800;
    color: var(--cyan);
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
  }
  .entry-title-bar .sub {
    font-size: clamp(10px, 2.8vw, 14px);
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
  }

  /* 2. Переключатель языка (Между карточкой и кнопками) */
  .lang-switch {
    background: #000000;
    border: 2px solid var(--green);
    border-radius: 10px;
    padding: 6px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 8px rgba(166, 242, 74, 0.15);
  }
  .lang-switch .btn2 {
    background: transparent;
    border: none;
    padding: 0;
    font-size: 14px;
    color: var(--green);
    box-shadow: none !important;
  }

  /* 3. Блок кнопок (Симметричная сетка) */
  .entry-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(90vw, 360px);
  }

  .entry-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }

  .entry-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: 100%;
  }

  .entry-buttons .btn2 {
    width: 100%;
    padding: 12px 0;
    font-size: 15px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .provider-github { color: #ffffff; }
  .provider-google { color: var(--cyan); }
  .provider-bitbucket { color: #f0975f; }

  /* 4. Обрезанный подвал (Только 3 иконки) */
  .settings-footer {
    background: #000000;
    border: 2px solid var(--green);
    border-radius: 14px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: fit-content;
    box-shadow: 0 0 10px rgba(166, 242, 74, 0.2);
  }
  .settings-footer a {
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settings-footer .ic {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--green);
    color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800;
    flex-shrink: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .settings-footer a:hover .ic {
    transform: scale(1.1);
    box-shadow: 0 0 10px rgba(166, 242, 74, 0.6);
  }

  /* ───────── MAIN SCREEN ───────── */
  .topbar {
    height: 56px; background: #000;
    border-bottom: 1px solid var(--cyan-dim);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; flex-shrink: 0;
  }
  .topbar .logo {
    font-family: 'Courier New', monospace; letter-spacing: 6px;
    font-size: 20px; color: var(--cyan);
  }
  #screen-main { padding: 16px; gap: 12px; border: 2px solid var(--cyan); }
  .video-frame {
    flex: 1; min-height: 0; background: #000;
    border: 1px solid var(--green-dim); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; width: 100%;
  }
  .video-frame video { width: 100%; height: 100%; object-fit: contain; display: none; }
  .video-frame .placeholder { color: rgba(255,255,255,0.25); font-size: 13px; }
  .toolbar-row { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .toolbar-left { display: flex; gap: 10px; }
  .toolbar-left .btn2 { padding: 10px 18px; font-size: 14px; }
  #btn-send { padding: 10px 26px; font-size: 14px; }

  .type-row { position: relative; flex-shrink: 0; }
  #prompt-input {
    width: 100%; background: #000;
    border: 1px solid var(--cyan); border-radius: 14px;
    color: #fff; font-size: 15px; padding: 16px 18px;
    font-family: var(--font); resize: none; outline: none;
  }
  #char-count { position: absolute; right: 16px; bottom: -18px; font-size: 11px; color: rgba(255,255,255,0.4); }

  /* SETTINGS SCREEN */
  #screen-settings { padding: 20px 20px 0; align-items: center; border: 2px solid var(--cyan); }
  .balance-card {
    background: #000; border: 1px solid var(--green); border-radius: 14px;
    width: min(92vw, 520px); padding: 18px 22px;
    display: flex; justify-content: space-between; align-items: center; margin-top: 28px;
  }

</style>
</head>
<body>

<div id="app">

  <!-- ═══════════ ENTRY SCREEN ═══════════ -->
  <section class="screen active" id="screen-entry">
    <div class="entry-content">
      
      <!-- 1. Верхняя шапка -->
      <div class="entry-title-bar">
        <span class="intro" data-i18n="entry_intro">INTRODUCING</span>
        <span class="brand">SYNAPSE AI</span>
        <span class="sub">OTAN SYSTEMS</span>
      </div>

      <!-- 2. Переключатель языка -->
      <div class="lang-switch">
        <button type="button" class="btn2 lang-btn" id="langToggle">English/Русский</button>
      </div>

      <!-- 3. Блок авторизации -->
      <div class="entry-buttons">
        <div class="entry-row-2">
          <button type="button" class="btn2 auth-btn" data-i18n="entry_signup">Sign Up</button>
          <button type="button" class="btn2 auth-btn" data-i18n="entry_signin">Sign In</button>
        </div>
        <div class="entry-row-3">
          <button type="button" class="btn2 auth-btn provider-github">GitHub</button>
          <button type="button" class="btn2 auth-btn provider-google">Google</button>
          <button type="button" class="btn2 auth-btn provider-bitbucket">BitBucket</button>
        </div>
      </div>

      <!-- 4. Обрезанная нижняя карточка (только 3 иконки) -->
      <div class="settings-footer">
        <a href="https://otansystems.com/synapse" target="_blank" title="Visit our website"><span class="ic">&#127760;</span></a>
        <a href="mailto:otan-systems@proton.me" title="Contact Sales & Support"><span class="ic">&#9993;</span></a>
        <a href="https://otansystems.com/synapse/reference" target="_blank" title="Terms of Use & Policy"><span class="ic">?</span></a>
      </div>

    </div>
  </section>

  <!-- ═══════════ MAIN SCREEN ═══════════ -->
  <section class="screen" id="screen-main">
    <div class="topbar">
      <div class="side">
        <div class="icon-btn btn2 armable" id="btn-gear" title="Settings">&#9881;</div>
      </div>
      <div class="logo">SYNAPSE</div>
      <div class="side"></div>
    </div>

    <div class="video-frame" id="videoFrame" style="aspect-ratio: 16/9;">
      <div class="placeholder" id="videoPlaceholder" data-i18n="video_placeholder">Your generated video will appear here</div>
      <div class="status" id="videoStatus" data-i18n="video_generating">Generating…</div>
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="toolbar-row">
      <div class="toolbar-left">
        <button type="button" class="btn2 armable" id="btn-addfiles" data-i18n="btn_addfiles">Add files</button>
        <button type="button" class="btn2 cyan armable" id="btn-mode" data-i18n="btn_mode">Mode</button>
        <input type="file" id="fileInput" multiple hidden>
      </div>
      <button type="button" class="btn2 green armable" id="btn-send" disabled data-i18n="btn_send">Send</button>
    </div>

    <div class="type-row">
      <textarea id="prompt-input" rows="2" maxlength="5000" data-i18n-placeholder="type_here" placeholder="Type here..."></textarea>
      <div id="char-count">0 / 5000</div>
    </div>
  </section>

  <!-- ═══════════ SETTINGS SCREEN ═══════════ -->
  <section class="screen" id="screen-settings">
    <div class="topbar">
      <div class="side">
        <div class="icon-btn btn2 armable" id="btn-back" title="Back">&#8630;</div>
      </div>
      <div class="logo">SYNAPSE</div>
      <div class="side"></div>
    </div>

    <div class="balance-card">
      <span class="lbl" data-i18n="balance_label">Your Balance:</span>
      <span class="val" id="balanceVal">0 sec</span>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
