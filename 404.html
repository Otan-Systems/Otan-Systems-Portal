<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>404: Not Found</title>
<style>
@font-face {
  font-family: 'Peace Sans';
  src: url('/peace_sans.otf') format('opentype');
  font-display: swap;
}

:root {
  --bg: #000;
  --white: #fff;
  --orange: #ff7a1c;
  --lime: #c3ff6b;
  --font: 'Peace Sans', 'Arial Black', 'Segoe UI Black', Impact, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--white);
  font-family: var(--font); font-weight: 400; line-height: 1.2;
  min-height: 100svh; display: flex; align-items: center; justify-content: center;
  padding: clamp(20px, 4vw, 52px);
}
h1, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

main { display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 5vw, 48px); }

.circle {
  width: clamp(240px, 70vw, 340px); aspect-ratio: 1;
  border: 8px solid var(--orange); border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  text-align: center;
}
.code { font-size: clamp(64px, 18vw, 104px); line-height: 1; color: var(--white); }
.text { font-size: clamp(22px, 5vw, 30px); line-height: 1.1; color: var(--orange); }

.btn {
  display: inline-block; text-decoration: none; color: var(--white); background: #000;
  font-size: clamp(24px, 4vw, 40px); line-height: 1.1;
  border: 6px solid var(--lime); border-radius: 22px; padding: 12px 36px;
  transition: transform .2s ease;
}
.btn:hover { transform: scale(.97); }

/* typewriter caret: нулевой ширины, не сдвигает вёрстку */
.tw-caret { display: inline-block; width: 0; height: 0; position: relative; pointer-events: none; }
.tw-caret::after {
  content: ""; position: absolute; left: 0; bottom: -.15em;
  width: max(2px, .07em); height: 1em; background: currentColor;
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<main>
  <div class="circle">
    <h1 class="code" tabindex="-1">404</h1>
    <p class="text">Not Found</p>
  </div>
  <a class="btn" href="https://otansystems.com" target="_self">&gt; To Lobby</a>
</main>

<script>
'use strict';
/* Typewriter для текста, Fade In для остального — как на главной. */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const fades = [...document.querySelectorAll('.circle, .btn')];
  const texts = [...document.querySelectorAll('.code, .text, .btn')];

  fades.forEach((e, i) => e.animate([{ opacity: 0 }, { opacity: 1 }], {
    duration: 600, delay: i * 350, easing: 'ease-out', fill: 'backwards',
  }));

  const tasks = texts.map((e, i) => {
    const node = [...e.childNodes].find(n => n.nodeType === 3 && n.data.trim());
    const hid = document.createElement('span');
    const caret = document.createElement('span');
    const full = node.data;
    hid.style.visibility = 'hidden';
    hid.setAttribute('aria-hidden', 'true');
    hid.textContent = full;
    caret.className = 'tw-caret';
    caret.setAttribute('aria-hidden', 'true');
    node.after(hid);
    node.data = '';
    return {
      node, hid, caret, full, n: -1,
      start: performance.now() + [100, 550, 1000][i],
      dur: Math.max(350, Math.min(full.length * 40, 1100)),
    };
  });

  function tick(now) {
    let left = 0;
    tasks.forEach(t => {
      if (t.done) return;
      if (now < t.start) { left++; return; }
      const p = Math.min((now - t.start) / t.dur, 1);
      if (p === 1) {
        t.node.data = t.full; t.hid.remove(); t.caret.remove(); t.done = true;
        return;
      }
      const k = Math.floor(p * t.full.length);
      if (k !== t.n) {
        t.n = k;
        t.node.data = t.full.slice(0, k);
        t.hid.textContent = t.full.slice(k);
        t.node.after(t.caret);
      }
      left++;
    });
    if (left) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
