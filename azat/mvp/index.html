<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azat AI MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/x86asm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cmake.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --text: #ffffff;
    --text-light: #8a8a8a;
    --border: #2a2a2a;
    --border-strong: #ffffff;
    --bubble-user: #ffffff;
    --bubble-user-text: #000000;
    --bubble-ai: #141414;
    --bubble-ai-text: #ffffff;
    --danger: #ff5c5c;
    --code-bg: #0b0b0b;
    --code-head: #1a1a1a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand img { width: 32px; height: 32px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--text); }

  nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
  }
  nav a:hover { background: var(--bubble-ai); }

  .lang {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-left: 6px;
  }
  .lang button {
    border: 0;
    background: none;
    color: var(--text);
    font: 600 12px 'Montserrat', Arial, sans-serif;
    padding: 7px 10px;
    cursor: pointer;
  }
  .lang button.active { background: var(--bubble-user); color: #000; }

  #chatWrap { flex: 1; min-height: 0; position: relative; }

  #chat {
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  #hero {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #hero img { width: min(40vmin, 260px); height: auto; }
  #chatWrap.has-msgs #hero { display: none; }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    min-width: 0;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    color: var(--bubble-ai-text);
    border-bottom-left-radius: 4px;
    white-space: normal;
  }

  .msg.ai > :first-child { margin-top: 0; }
  .msg.ai > :last-child { margin-bottom: 0; }
  .msg.ai p { margin: 0 0 8px; }
  .msg.ai h4 { margin: 10px 0 6px; font-size: 14px; font-weight: 700; }
  .msg.ai ul, .msg.ai ol { margin: 0 0 8px; padding-left: 20px; }
  .msg.ai li { margin: 2px 0; }
  .msg.ai code { background: #262626; padding: 1px 5px; border-radius: 5px; font-family: Consolas, monospace; font-size: 13px; }

  .codebox { margin: 0 0 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 6px 12px; background: var(--code-head); font-size: 12px; font-weight: 600; color: var(--text-light); }
  .code-copy { border: 0; background: none; color: var(--text); font: 600 12px 'Montserrat', Arial, sans-serif; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .code-copy:hover { background: #2a2a2a; }
  .msg.ai .codebox pre { margin: 0; padding: 10px 0; background: none; border-radius: 0; overflow-x: auto; counter-reset: line; }
  .msg.ai .codebox pre code { display: block; width: max-content; min-width: 100%; background: none; padding: 0; border-radius: 0; font-family: Consolas, monospace; font-size: 13px; line-height: 1.5; color: #e6e6e6; }
  .cl { display: block; padding-right: 14px; white-space: pre; }
  .cl::before { counter-increment: line; content: counter(line); display: inline-block; width: 3.2ch; margin: 0 14px 0 10px; text-align: right; color: #666; user-select: none; }

  .hljs-comment, .hljs-quote { color: #7d8590; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag, .hljs-deletion { color: #ff7b72; }
  .hljs-string, .hljs-regexp { color: #a5d6ff; }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: #79c0ff; }
  .hljs-title, .hljs-section { color: #d2a8ff; }
  .hljs-type, .hljs-built_in, .hljs-title.class_ { color: #ffa657; }
  .hljs-meta, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-addition { color: #7ee787; }

  .filecard { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--code-bg); }
  .file-name { font-weight: 700; font-size: 14px; }
  .file-meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .file-dl { border: 0; border-radius: 8px; background: var(--bubble-user); color: #000; font: 600 12px 'Montserrat', Arial, sans-serif; padding: 8px 14px; cursor: pointer; }
  .file-dl:hover { opacity: 0.9; }

  .msg.ai a { color: var(--text); text-decoration: underline; }
  .msg.ai hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }

  .msg.system {
    align-self: center;
    background: none;
    color: var(--danger);
    font-size: 12px;
    font-weight: 500;
  }

  .msg.loading {
    align-self: flex-start;
    color: var(--text-light);
    font-size: 13px;
    font-style: italic;
  }

  footer {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 140px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
  }

  #input:focus { border-color: var(--border-strong); }
  
  #input:disabled {
  background: #111;
  color: var(--text-light);
  cursor: not-allowed;
  }

  #send {
    padding: 12px 20px;
    background: var(--bubble-user);
    color: #000000;
    border: none;
    border-radius: 12px;
    font-family: 'Montserrat', Arial, sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  #send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #send:hover:not(:disabled) { opacity: 0.9; }

  #plus { width: 44px; height: 44px; flex: none; border: 1px solid var(--border); border-radius: 12px; background: none; color: var(--text); font: 400 24px/1 'Montserrat', Arial, sans-serif; cursor: pointer; }
  #plus:hover:not(:disabled) { border-color: var(--border-strong); }
  #plus:disabled { opacity: 0.5; cursor: not-allowed; }

  #attachErr { padding: 0 20px; font-size: 12px; font-weight: 500; color: var(--danger); }
  #attachBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px; }
  #attachBar[hidden] { display: none; }

  .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { position: relative; display: flex; flex-direction: column; gap: 6px; width: 148px; padding: 6px 10px 9px; border: 1px solid var(--border); border-radius: 10px; background: #141414; color: var(--text); }
  .chip-top { display: flex; justify-content: flex-end; height: 16px; }
  .chip-x { border: 0; background: none; color: var(--text-light); font-size: 16px; line-height: 1; padding: 0; cursor: pointer; }
  .chip-x:hover { color: var(--text); }
  .chip-mid { display: flex; align-items: center; gap: 10px; }
  .chip-ico { width: 26px; height: 26px; flex: none; }
  .chip-size { font-size: 12px; font-weight: 600; color: var(--text-light); }
  .chip-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .msg.user .chip { background: #000; border-color: #000; color: #fff; }
  .msg.user .chip-size, .msg.user .chip-x { color: #8a8a8a; }

  /* ---- Membership login ---- */
  #login {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  #login[hidden] { display: none; }
  .login-card {
    width: 100%;
    max-width: 360px;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  .login-card img { width: 56px; height: 56px; }
  .login-card h2 { margin: 12px 0 4px; font-size: 18px; font-weight: 700; }
  .login-card p { margin: 0 0 16px; font-size: 13px; color: var(--text-light); }
  #loginInput {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font: 500 14px 'Montserrat', Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    text-align: center;
    letter-spacing: 1px;
    outline: none;
  }
  #loginInput:focus { border-color: var(--border-strong); }
  #loginBtn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: var(--bubble-user);
    color: #000;
    border: 0;
    border-radius: 12px;
    font: 600 14px 'Montserrat', Arial, sans-serif;
    cursor: pointer;
  }
  #loginBtn:hover { opacity: 0.9; }
  #loginErr { min-height: 18px; margin-top: 10px; font-size: 12px; font-weight: 500; color: var(--danger); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201000%201000%22%3E%3Cpolygon%20points=%22500,50%20933,300%20500,550%2067,300%22%20fill=%22%23ffffff%22%20stroke=%22%23000000%22%20stroke-width=%2235%22%20stroke-linejoin=%22round%22/%3E%3Cpolygon%20points=%2267,300%20500,550%20500,950%2067,700%22%20fill=%22%231200b3%22%20stroke=%22%23000000%22%20stroke-width=%2235%22%20stroke-linejoin=%22round%22/%3E%3Cpolygon%20points=%22500,550%20933,300%20933,700%20500,950%22%20fill=%22%233caeff%22%20stroke=%22%23000000%22%20stroke-width=%2235%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E" alt="Azat A1 logo">
    <h1>Azat AI</h1>
  </div>
  <nav>
    <a href="https://otansystems.com" target="_blank" rel="noopener" data-i18n="about">About Us</a>
    <a href="https://otansystems.com/azat" target="_blank" rel="noopener" data-i18n="azat">Azat</a>
    <a href="mailto:otan-systems@proton.me" target="_blank" data-i18n="sales">Contact Sales</a>
    <div class="lang">
      <button data-lang="en">EN</button>
      <button data-lang="ru">RU</button>
    </div>
  </nav>
</header>

<div id="login" hidden>
  <div class="login-card">
    <img id="loginLogo" alt="Azat A1 logo">
    <h2 data-i18n="loginTitle"></h2>
    <p data-i18n="loginHint"></p>
    <input id="loginInput" placeholder="0000-0000-0000-XXXXX" autocomplete="off" spellcheck="false">
    <button id="loginBtn" data-i18n="loginBtn"></button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="chatWrap">
  <div id="hero"><img id="heroLogo" alt="Azat AI"></div>
  <div id="chat"></div>
</div>
<div id="attachErr"></div>
<div id="attachBar" hidden></div>

<footer>
  <button id="plus" type="button">+</button>
  <input type="file" id="fileInput" multiple hidden>
  <textarea id="input" data-i18n-ph="placeholder" rows="1"></textarea>
  <button id="send" data-i18n="send"></button>
</footer>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = []; 
  let log = [];   

  const CODE_FILE_LINES = 250;
  const MAX_FILES = 3;
  const MAX_FILE_BYTES = 100 * 1024;
  const CHAT_KEY = 'azat_chat';
  const DRAFT_KEY = 'azat_draft';

  const chatWrap = document.getElementById('chatWrap');
  const plusBtn = document.getElementById('plus');
  const fileInput = document.getElementById('fileInput');
  const attachBar = document.getElementById('attachBar');
  const attachErr = document.getElementById('attachErr');
  let pendingFiles = [];
  let attachErrTimer = 0;

  const I18N = {
    ru: { about: 'О нас', azat: 'Azat', sales: 'Отдел продаж', placeholder: 'Напишите сообщение...', send: 'Отправить',
          typing: 'Печатает...', error: 'Ошибка', empty: '(пустой ответ)', expired: 'Срок действия Membership ID истёк',
          loginTitle: 'Вход по Membership ID', loginHint: 'Введите ваш Membership ID', loginBtn: 'Войти',
          loginBad: 'Неверный Membership ID', loginExpired: 'Срок действия этого Membership ID (96 часов) истёк',
          copy: 'Копировать', copied: 'Скопировано', download: 'Скачать', lines: 'строк',
          tooMany: 'Максимум 3 файла', tooBig: 'файл больше 100 КБ', notText: 'не текстовый файл' },
    en: { about: 'About Us', azat: 'Azat', sales: 'Contact Sales', placeholder: 'Type a message...', send: 'Send',
          typing: 'Typing...', error: 'Error', empty: '(empty response)', expired: 'Membership ID has expired',
          loginTitle: 'Sign in with Membership ID', loginHint: 'Enter your Membership ID', loginBtn: 'Sign in',
          loginBad: 'Invalid Membership ID', loginExpired: 'This Membership ID (96 hours) has expired',
          copy: 'Copy', copied: 'Copied', download: 'Download', lines: 'lines',
          tooMany: 'Max 3 files', tooBig: 'file is larger than 100 KB', notText: 'not a text file' }
  };
  let lang = localStorage.getItem('lang') || 'ru';
  const t = (k) => I18N[lang][k];

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    localStorage.setItem('lang', lang);
    applyLang();
  }));
  
  const loginEl = document.getElementById('login');
  const loginInput = document.getElementById('loginInput');
  const loginErr = document.getElementById('loginErr');
  document.getElementById('loginLogo').src = document.querySelector('.brand img').src;
  document.getElementById('heroLogo').src = document.querySelector('.brand img').src;

  function showLogin() { loginEl.hidden = false; loginInput.focus(); }

  const API_BASE = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');

  const TOKEN_KEY = 'azat_token';

  function tokenValid() {
    try {
      const tok = localStorage.getItem(TOKEN_KEY);
      const exp = JSON.parse(atob(tok.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))).exp;
      return exp > Date.now();
    } catch { return false; }
  }

  async function doLogin() {
    try {
      const r = await fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: loginInput.value })
      });
      const res = await r.json();
      if (res.ok) {
        localStorage.setItem(TOKEN_KEY, res.token);
        loginEl.hidden = true;
        loginErr.textContent = '';
        loginInput.value = '';
        inputEl.focus();
      } else {
        loginErr.textContent = t('loginBad');
      }
    } catch {
      loginErr.textContent = t('error');
    }
  }
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  loginInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function inlineMd(s) {
    s = escapeHtml(s);
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => '<strong>' + (a || b) + '</strong>');
    s = s.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
  }

  const EXT = {
    c: 'c', h: 'h', cpp: 'cpp', 'c++': 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'hpp',
    rust: 'rs', rs: 'rs', asm: 'asm', fasm: 'asm', nasm: 'asm', x86asm: 'asm',
    arduino: 'ino', ino: 'ino', cmake: 'cmake', makefile: 'mk', make: 'mk',
    bash: 'sh', sh: 'sh', shell: 'sh', zsh: 'sh', python: 'py', py: 'py',
    javascript: 'js', js: 'js', typescript: 'ts', ts: 'ts', json: 'json',
    toml: 'toml', yaml: 'yaml', yml: 'yaml', ini: 'ini', html: 'html', xml: 'xml',
    css: 'css', sql: 'sql', go: 'go', java: 'java', diff: 'diff', markdown: 'md', md: 'md'
  };
  const HLJS_ALIAS = { fasm: 'x86asm', asm: 'x86asm', nasm: 'x86asm', arduino: 'cpp', ino: 'cpp', make: 'makefile', sh: 'bash', zsh: 'bash' };

  function highlightCode(lang, code) {
    const l = HLJS_ALIAS[lang] || lang;
    try {
      if (window.hljs && l && hljs.getLanguage(l)) {
        return hljs.highlight(code, { language: l, ignoreIllegals: true }).value;
      }
    } catch {}
    return escapeHtml(code);
  }

  function splitHtmlLines(html) {
    const out = [], open = [];
    let cur = '';
    const flush = () => {
      if (!cur.replace(/<[^>]*>/g, '')) cur += '\u200B';
      out.push('<span class="cl">' + cur + '</span>'.repeat(open.length + 1));
    };
    for (const tok of html.match(/<span[^>]*>|<\/span>|\n|[^<\n]+/g) || []) {
      if (tok === '\n') { flush(); cur = open.join(''); }
      else {
        cur += tok;
        if (tok[0] === '<') { if (tok[1] === '/') open.pop(); else open.push(tok); }
      }
    }
    flush();
    return out.join('');
  }

  function codeBox(lang, code) {
    return '<div class="codebox"><div class="code-head"><span>' + escapeHtml((lang || 'text').toUpperCase()) +
      '</span><button class="code-copy" type="button" data-code="' + encodeURIComponent(code) + '">' + t('copy') + '</button></div>' +
      '<pre><code>' + splitHtmlLines(highlightCode(lang, code)) + '</code></pre></div>';
  }

  function fileCard(lang, code, idx, total) {
    const name = (total === 1 ? 'code' : 'code' + idx) + '.' + (EXT[lang] || 'txt');
    const n = code.split('\n').length;
    return '<div class="filecard"><div><div class="file-name">' + name + '</div><div class="file-meta">' +
      escapeHtml((lang || 'text').toUpperCase()) + ' · ' + n + ' ' + t('lines') + '</div></div>' +
      '<button class="file-dl" type="button" data-name="' + name + '" data-code="' + encodeURIComponent(code) + '">' + t('download') + '</button></div>';
  }

  async function copyText(s) {
    try { await navigator.clipboard.writeText(s); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
  }

  function downloadText(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  chatEl.addEventListener('click', (e) => {
    const cp = e.target.closest('.code-copy');
    if (cp) {
      copyText(decodeURIComponent(cp.dataset.code));
      cp.textContent = t('copied');
      setTimeout(() => { cp.textContent = t('copy'); }, 1500);
      return;
    }
    const dl = e.target.closest('.file-dl');
    if (dl) downloadText(dl.dataset.name, decodeURIComponent(dl.dataset.code));
  });

  function renderMarkdown(text) {
    text = text
      .replace(/<think>[\s\S]*?<\/think>/gi, '')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .replace(/\r\n/g, '\n')
      .trim();

    const blocks = [];
    const FENCE = /```([\w+#.-]*)\n?([\s\S]*?)```/g;
    const lineCount = (c) => c.replace(/\n$/, '').split('\n').length;
    const bigTotal = [...text.matchAll(FENCE)].filter(m => lineCount(m[2]) >= CODE_FILE_LINES).length;
    let bigIdx = 0;
    text = text.replace(FENCE, (_, lang, code) => {
      code = code.replace(/\n$/, '');
      lang = lang.toLowerCase();
      blocks.push(code.split('\n').length >= CODE_FILE_LINES
        ? fileCard(lang, code, ++bigIdx, bigTotal)
        : codeBox(lang, code));
      return '\n\u0001' + (blocks.length - 1) + '\u0001\n';
    });

    const out = [];
    let list = null, para = [];
    const flushPara = () => {
      if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; }
    };
    const flushList = () => {
      if (list) {
        out.push('<' + list.t + '>' + list.items.map(i => '<li>' + inlineMd(i) + '</li>').join('') + '</' + list.t + '>');
        list = null;
      }
    };
    const pushItem = (tag, item) => {
      flushPara();
      if (!list || list.t !== tag) { flushList(); list = { t: tag, items: [] }; }
      list.items.push(item);
    };

    for (const line of text.split('\n')) {
      let m;
      if ((m = line.match(/^\u0001(\d+)\u0001$/))) { flushPara(); flushList(); out.push(blocks[m[1]]); }
      else if ((m = line.match(/^\s{0,3}#{1,6}\s+(.+?)\s*#*$/))) { flushPara(); flushList(); out.push('<h4>' + inlineMd(m[1]) + '</h4>'); }
      else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); }
      else if ((m = line.match(/^\s*[-*+•]\s+(.+)/))) pushItem('ul', m[1]);
      else if ((m = line.match(/^\s*\d+[.)]\s+(.+)/))) pushItem('ol', m[1]);
      else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(line.trim()); }
    }
    flushPara(); flushList();
    return out.join('');
  }

  function applyRegexToOutgoing(text) {
    if (!text) return text;

    const replacements = [
      { regex: /Nemotron 3 Ultra/gi, value: 'Azat A1' },
      { regex: /Nemotron/gi, value: 'Azat A1' },
      { regex: /NVIDIA/gi, value: 'Otan Systems' },
      { regex: /Jensen Huang/gi, value: 'Otan Systems' },
      { regex: /Open-source/gi, value: 'Proprietary' },
      { regex: /2484 Berryessa Rd, San Jose, CA 95132/gi, value: 'Syganak St., 60/5' },
      { regex: /2788 San Tomas Expressway, Santa Clara, CA 95051/gi, value: 'Syganak St., 60/5' },
      { regex: /United States of America/gi, value: 'Republic of Kazakhstan' },
      { regex: /\bUSA\b/g, value: 'Republic of Kazakhstan' },
      { regex: /California/gi, value: 'Aqmola Region' },
      { regex: /San Jose/gi, value: 'Astana' },
      { regex: /Santa Clara/gi, value: 'Astana' },
      { regex: /Taiwan/gi, value: 'Kazakhstan' }
    ];

    let result = text;
    replacements.forEach(({ regex, value }) => {
      result = result.replace(regex, value);
    });

    return result;
  }

  function applyRegexToIncoming(text) {
    return applyRegexToOutgoing(text);
  }

  const fmtSize = (n) => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
  const ICONS = {
    code: '<polyline points="9 8 5 12 9 16"/><polyline points="15 8 19 12 15 16"/>',
    text: '<line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
    data: '<path d="M9 7c-2 0-2 1-2 2.5S7 12 5.5 12C7 12 7 13 7 14.5S7 17 9 17"/><path d="M15 7c2 0 2 1 2 2.5S17 12 18.5 12C17 12 17 13 17 14.5S17 17 15 17"/>',
    web: '<path d="M9 8l-4 4 4 4"/><path d="M15 8l4 4-4 4"/><line x1="13" y1="7" x2="11" y2="17"/>',
    shell: '<polyline points="7 9 11 12 7 15"/><line x1="13" y1="16" x2="17" y2="16"/>',
    doc: ''
  };
  const EXT_GROUP = {
    code: 'c h cpp hpp cc cxx rs go py js ts jsx tsx java kt swift cs rb php lua asm s nasm zig dart cmake mk makefile',
    text: 'txt md log rst csv tsv ini cfg conf',
    data: 'json yaml yml toml xml sql',
    web: 'html htm css scss vue svelte',
    shell: 'sh bash zsh bat ps1 fish'
  };
  function fileExt(name) {
    const i = name.lastIndexOf('.');
    return i > 0 ? name.slice(i + 1) : '';
  }
  function shortName(name) {
    const i = name.lastIndexOf('.');
    if (i <= 0) return name.length > 6 ? name.slice(0, 6) + '..' : name;
    const base = name.slice(0, i), ext = name.slice(i);
    return (base.length > 6 ? base.slice(0, 6) + '..' : base) + ext;
  }
  function iconSvg(name) {
    const ext = fileExt(name).toLowerCase();
    let g = 'doc';
    for (const k in EXT_GROUP) if (EXT_GROUP[k].split(' ').includes(ext)) { g = k; break; }
    return '<svg class="chip-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/>' + ICONS[g] + '</svg>';
  }
  function chipHtml(f, withX, idx) {
    return '<div class="chip-top">' + (withX ? '<button type="button" class="chip-x" data-i="' + idx + '">×</button>' : '') + '</div>' +
      '<div class="chip-mid">' + iconSvg(f.name) + '<span class="chip-size">' + fmtSize(f.size) + '</span></div>' +
      '<div class="chip-name" title="' + f.name.replace(/"/g, '&quot;') + '">' + shortName(f.name).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>';
  }

  function chipsEl(files) {
    const box = document.createElement('div');
    box.className = 'msg-files';
    files.forEach(f => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = chipHtml(f, false);
      box.appendChild(c);
    });
    return box;
  }

  function addMessage(role, text, files) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'ai') div.innerHTML = renderMarkdown(text);
    else if (role === 'user' && files && files.length) {
      div.appendChild(chipsEl(files));
      if (text) { const s = document.createElement('div'); s.textContent = text; div.appendChild(s); }
    } else div.textContent = text;
    chatEl.appendChild(div);
    chatWrap.classList.add('has-msgs');
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }
  
  function typeMessage(text) {
  return new Promise(resolve => {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.innerHTML = renderMarkdown(text);
    chatEl.appendChild(div);

    const steps = [];
    const walker = document.createTreeWalker(div, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) {
      if (n.nodeType === 3) {
        if (n.data.length) { steps.push({ node: n, full: n.data }); n.data = ''; }
      } else if (n.tagName === 'BR' || n.tagName === 'HR') {
        steps.push({ node: n, full: null });
      }
    }
    div.querySelectorAll('*').forEach(el => el.style.display = 'none');
    const reveal = (node) => {
      for (let el = node.nodeType === 3 ? node.parentNode : node; el && el !== div; el = el.parentNode) {
        el.style.display = '';
      }
    };

    const total = steps.reduce((s, x) => s + (x.full === null ? 1 : x.full.length), 0);
    let si = 0, ci = 0, typed = 0, ended = false, raf = 0;

    const end = () => {
      if (ended) return;
      ended = true;
      cancelAnimationFrame(raf);
      div.removeEventListener('click', finish);
      chatEl.scrollTop = chatEl.scrollHeight;
      resolve();
    };
    function finish() {
      steps.forEach(s => { if (s.full !== null) s.node.data = s.full; });
      div.querySelectorAll('*').forEach(el => el.style.display = '');
      end();
    }
    div.addEventListener('click', finish); // клик по сообщению = пропустить

    function tick() {
      if (document.hidden) { finish(); return; }
      let budget = Math.max(2, Math.ceil((total - typed) / 40)); // адаптивная скорость
      while (budget > 0 && si < steps.length) {
        const s = steps[si];
        if (s.full === null) { reveal(s.node); si++; typed++; budget--; continue; }
        if (ci === 0) reveal(s.node);
        const take = Math.min(budget, s.full.length - ci);
        ci += take; typed += take; budget -= take;
        s.node.data = s.full.slice(0, ci);
        if (ci >= s.full.length) { si++; ci = 0; }
      }
      chatEl.scrollTop = chatEl.scrollHeight;
      if (si < steps.length) raf = requestAnimationFrame(tick); else end();
    }
    tick();
  });
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }
  function saveChat() {
    try { localStorage.setItem(CHAT_KEY, JSON.stringify({ history, log })); } catch {}
  }
  function saveDraft() {
    try {
      if (inputEl.value) localStorage.setItem(DRAFT_KEY, inputEl.value);
      else localStorage.removeItem(DRAFT_KEY);
    } catch {}
  }
  function restoreSession() {
    try {
      const s = JSON.parse(localStorage.getItem(CHAT_KEY) || 'null');
      if (s && Array.isArray(s.history) && Array.isArray(s.log)) { history = s.history; log = s.log; }
    } catch {}
    log.forEach(m => {
      if (m.role === 'user') addMessage('user', m.text, m.files);
      else addMessage('ai', applyRegexToIncoming(m.text));
    });
    inputEl.value = localStorage.getItem(DRAFT_KEY) || '';
    autoResize();
  }
  inputEl.addEventListener('input', () => { autoResize(); saveDraft(); });

  function showAttachErr(msg) {
    attachErr.textContent = msg;
    clearTimeout(attachErrTimer);
    attachErrTimer = setTimeout(() => { attachErr.textContent = ''; }, 4000);
  }
  function renderAttachBar() {
    attachBar.hidden = !pendingFiles.length;
    attachBar.innerHTML = '';
    pendingFiles.forEach((f, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = chipHtml(f, true, i);
      attachBar.appendChild(chip);
    });
  }
  attachBar.addEventListener('click', (e) => {
    const x = e.target.closest('.chip-x');
    if (!x) return;
    pendingFiles.splice(+x.dataset.i, 1);
    renderAttachBar();
  });
  async function addFiles(list) {
    for (const f of list) {
      if (pendingFiles.length >= MAX_FILES) { showAttachErr(t('tooMany')); break; }
      if (f.size > MAX_FILE_BYTES) { showAttachErr(f.name + ': ' + t('tooBig')); continue; }
      let content;
      try { content = await f.text(); } catch { showAttachErr(f.name + ': ' + t('error')); continue; }
      if (content.includes('\u0000')) { showAttachErr(f.name + ': ' + t('notText')); continue; }
      pendingFiles.push({ name: f.name, size: f.size, content });
    }
    renderAttachBar();
  }
  plusBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    await addFiles(fileInput.files);
    fileInput.value = '';
  });

  async function sendMessage() {
    const raw = inputEl.value.trim();
    if (!raw && !pendingFiles.length) return;

    const files = pendingFiles;
    pendingFiles = [];
    renderAttachBar();

    const meta = files.map(f => ({ name: f.name, size: f.size }));
    const fileBlocks = files.map(f => '[' + f.name + '/]\n' + f.content + '\n[/' + f.name + ']').join('\n\n');
    const userText = [applyRegexToOutgoing(raw), fileBlocks].filter(Boolean).join('\n\n');

    addMessage('user', raw, meta);
    history.push({ role: 'user', content: userText });
    log.push({ role: 'user', text: raw, files: meta });
    saveChat();

    inputEl.value = '';
    autoResize();
    saveDraft();
    sendBtn.disabled = true;
    inputEl.disabled = true;
    plusBtn.disabled = true;

    const loadingEl = addMessage('loading', t('typing'));

    try {
      const r = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (localStorage.getItem(TOKEN_KEY) || '')
        },
        body: JSON.stringify({ messages: history }),
        signal: AbortSignal.timeout(300000)
      });
      let res;
      try { res = await r.json(); } catch { res = { ok: false, error: 'HTTP ' + r.status }; }
      if (!res.ok) {
        if (res.error === 'auth') { showLogin(); throw new Error(t('expired')); }
        throw new Error(res.error);
      }
      const rawReply = res.content || t('empty');
      const reply = applyRegexToIncoming(rawReply);

      history.push({ role: 'assistant', content: rawReply });
      log.push({ role: 'ai', text: rawReply });
      saveChat();

      loadingEl.remove();
      await typeMessage(reply);

    } catch (err) {
      loadingEl.remove();
      addMessage('system', t('error') + ': ' + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      plusBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  
  applyLang();
  restoreSession();
  if (!tokenValid()) showLogin();
</script>
